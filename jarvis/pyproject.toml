[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis de Desarrollo — local voice assistant (voice→action bridge)"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "openwakeword",
    "sounddevice",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
