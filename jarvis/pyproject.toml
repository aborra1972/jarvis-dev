[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis de Desarrollo — local voice assistant (voice→action bridge)"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "sounddevice",
    "torch",
    "transformers",
    "onnxruntime",
    "scipy",
    "openwakeword",
    "edge-tts",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# PR6: e2e smoke tests need the real spike binaries (whisper-cli, piper,
# paplay, opencode) — excluded by default so the normal suite never touches
# them; run explicitly with: pytest -m e2e
addopts = "-m 'not e2e'"
markers = [
    "e2e: end-to-end smoke against real spike binaries (run with pytest -m e2e)",
]
