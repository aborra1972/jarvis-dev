# openspec/config.yaml — SDD project configuration (generated by sdd-init)
schema: spec-driven

project: jarvis-dev
real_path: /media/ale/Windows/Users/aleja/Documents/Proyectos/jarvis-dev
workspace_path: /home/ale/Proyectos/jarvis-dev  # symlink to real path
engram_project: ale  # Engram backup bucket for this project's memories

context: |
  Product: "Jarvis de Desarrollo" — voice assistant (Jarvis-style) dictating orders to OpenCode and executing system (shutdown/reboot/open apps), file (create docs), and web (search/open URLs) actions.
  Status: PRD approved (build from scratch, Option A); Linux spike COMPLETE (S1/S2/S3 + system/web/files OK; S4/WSL2 pending). No application code yet — SDD MVP starts now.
  Stack: Python 3.12.3 (system), git (repo initialized, no commits), OpenCode 1.18.18 (CLI + ACP/MCP); whisper.cpp (spike/whisper.cpp/build/bin/whisper-cli) + piper TTS es_AR-daniela (spike/.venv).
  Architecture: thin voice-to-action bridge: wake word -> local STT -> command interpreter -> OpenCode CLI / system / files / web.
  Testing: no runner configured (pytest absent; stdlib unittest available) — strict_tdd false until a runner is added.
  Style: English SDD artifacts, conventional commits, interactive execution, ask-on-risk delivery, 800-line review budget.

rules:
  proposal:
    - State intent, scope, and approach; reference PRD requirements (RF-xx) when available
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Keep requirements testable and verifiable
  design:
    - Include sequence diagrams for the voice flow (wake word -> STT -> interpreter -> action)
    - Document architecture decisions with rationale
    - Use spike findings (S1-S4) as evidence
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns; reuse spike artifacts (whisper-cli, piper venv) instead of rebuilding
      - Prefer stdlib where latency matters (voice pipeline)
    tdd: false  # no test runner configured yet (pytest pending)
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  runner: none detected (pytest not installed; stdlib unittest available as `python -m unittest`)
  layers:
    unit: "python -m unittest (stdlib only)"
    integration: none
    e2e: none (manual spike scripts only)
  coverage: none
  quality:
    linter: none
    type_checker: none
    formatter: none

session:
  artifact_store:
    mode: both  # OpenSpec files + Engram observations
  execution_mode: interactive
  delivery_strategy: ask-on-risk
  review_budget_lines: 800
